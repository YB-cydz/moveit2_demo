# =============================================================================
# 电机配置文件
# =============================================================================
# 该配置文件面向前端控制节点（bridge_node / pose_goal_node）。
# 包含两部分：
#   1. joint_to_motor  — MoveIt 关节名 → 电机 ID 映射
#   2. motor_currents  — 电机 ID → 额定电流 (A)
#
# 修改：直接编辑下方数值，colcon build 后生效（无需重新编译代码）。
# =============================================================================

# ── 关节 → 电机 ID ──
joint_to_motor:
  # 左臂（joint_states 索引 0-6 → 电机 11-17）
  shoulder_pitch_l_joint: 11
  shoulder_roll_l_joint:  12
  shoulder_yaw_l_joint:   13
  elbow_pitch_l_joint:    14
  elbow_yaw_l_joint:      15
  wrist_pitch_l_joint:    16
  wrist_roll_l_joint:     17
  # 右臂（joint_states 索引 7-13 → 电机 21-27）
  shoulder_pitch_r_joint: 21
  shoulder_roll_r_joint:  22
  shoulder_yaw_r_joint:   23
  elbow_pitch_r_joint:    24
  elbow_yaw_r_joint:      25
  wrist_pitch_r_joint:    26
  wrist_roll_r_joint:     27

# ── 电机额定电流 (A) ──
motor_currents:
  # 左臂（电机 11-17）
  11: 35.0    # shoulder_pitch_l_joint
  12: 23.0    # shoulder_roll_l_joint
  13: 8.0    # shoulder_yaw_l_joint
  14: 8.0   # elbow_pitch_l_joint
  15: 8.0    # elbow_yaw_l_joint
  16: 5.0    # wrist_pitch_l_joint
  17: 5.0    # wrist_roll_l_joint
  # 右臂（电机 21-27）
  21: 35.0    # shoulder_pitch_r_joint
  22: 23.0    # shoulder_roll_r_joint
  23: 8.0    # shoulder_yaw_r_joint
  24: 8.0    # elbow_pitch_r_joint
  25: 8.0    # elbow_yaw_r_joint
  26: 5.0    # wrist_pitch_r_joint
  27: 5.0    # wrist_roll_r_joint
