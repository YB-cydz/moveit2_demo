# =============================================================================
# 电机配置文件
# =============================================================================
# 该配置文件面向前端控制节点（bridge_node）。
# 包含：
#   1. joint_to_motor     — MoveIt 关节名 → 电机 ID 映射
#   2. motor_currents     — 电机 ID → 额定电流 (A)
#   3. motor_kp / motor_kd — 电机 PID 参数
#   4. motor_speed_limits — 电机限速 (RPM)
#
# 修改：直接编辑下方数值，colcon build 后生效（无需重新编译代码）。
# =============================================================================

# ── kp 全局比例系数 ──
# 下发时 kp = motor_kp × kp_scale
kp_scale: 1.0

# ── 关节 → 电机 ID ──
joint_to_motor:
  shoulder_pitch_l_joint: 11
  shoulder_roll_l_joint:  12
  shoulder_yaw_l_joint:   13
  elbow_pitch_l_joint:    14
  elbow_yaw_l_joint:      15
  wrist_pitch_l_joint:    16
  wrist_roll_l_joint:     17
  shoulder_pitch_r_joint: 21
  shoulder_roll_r_joint:  22
  shoulder_yaw_r_joint:   23
  elbow_pitch_r_joint:    24
  elbow_yaw_r_joint:      25
  wrist_pitch_r_joint:    26
  wrist_roll_r_joint:     27

# =============================================================================
# 电机 PID — kp — 左右对称
# =============================================================================
motor_kp:
  # shoulder_pitch
  11: 500.0
  21: 500.0
  # shoulder_roll
  12: 400.0
  22: 400.0
  # shoulder_yaw
  13: 200.0
  23: 200.0
  # elbow_pitch
  14: 200.0
  24: 200.0
  # elbow_yaw
  15: 200.0
  25: 200.0
  # wrist_pitch
  16: 100.0
  26: 100.0
  # wrist_roll
  17: 100.0
  27: 100.0

# =============================================================================
# 电机 PID — kd — 左右对称
# =============================================================================
motor_kd:
  # shoulder_pitch
  11: 20.0
  21: 20.0
  # shoulder_roll
  12: 15.0
  22: 15.0
  # shoulder_yaw
  13: 10.0
  23: 10.0
  # elbow_pitch
  14: 10.0
  24: 10.0
  # elbow_yaw
  15: 10.0
  25: 10.0
  # wrist_pitch
  16: 5.0
  26: 5.0
  # wrist_roll
  17: 5.0
  27: 5.0

