# =============================================================================
# 关节状态发布器配置
# =============================================================================
# 将真实硬件状态话题映射为 /joint_states。
# 修改映射关系后 colcon build 即可生效，无需重新编译代码。
#
# 格式：
#   motor_to_joint:    电机 ID (uint16) → URDF 关节名
#   hand_to_joint:     因时手索引 → URDF 关节名
#   fixed_joints:      无传感器关节，恒定为 0
# =============================================================================

# ── 发布频率 (Hz) ──
publish_rate: 50.0

# ── 关节状态 frame_id ──
frame_id: "base"

# =============================================================================
# /arm/status → 手臂关节 (MotorStatusMsg)
# =============================================================================
arm_motor_to_joint:
  11: shoulder_pitch_l_joint
  12: shoulder_roll_l_joint
  13: shoulder_yaw_l_joint
  14: elbow_pitch_l_joint
  15: elbow_yaw_l_joint
  16: wrist_pitch_l_joint
  17: wrist_roll_l_joint
  21: shoulder_pitch_r_joint
  22: shoulder_roll_r_joint
  23: shoulder_yaw_r_joint
  24: elbow_pitch_r_joint
  25: elbow_yaw_r_joint
  26: wrist_pitch_r_joint
  27: wrist_roll_r_joint

# =============================================================================
# /head/status → 头部关节 (MotorStatusMsg)
# =============================================================================
# 实际电机: 1(head_yaw), 2(head_pitch), 3(head_roll) — 如顺序不对请调换
head_motor_to_joint:
  3: head_yaw_joint
  2: head_pitch_joint
  1: head_roll_joint

# =============================================================================
# /waist/status → 腰部关节 (MotorStatusMsg)
# =============================================================================
# ── 关节标定偏移（硬件值 + offset = 发布值）──
joint_offsets:
  waist_pitch_joint: -0.34

waist_motor_to_joint:
  32: waist_pitch_joint
  31: waist_yaw_joint

# =============================================================================
# /leg/status → 腿部关节 (MotorStatusMsg)
# =============================================================================
leg_motor_to_joint:
  52: first_leg_pitch_joint
  51: second_leg_pitch_joint

# =============================================================================
# 手指关节 — 不通过 MoveIt 控制，不出现在 /joint_states 和 TF 中
# =============================================================================

# =============================================================================
# 被动/固定关节 — 无传感器反馈，恒定 0
# =============================================================================
fixed_joints: []
